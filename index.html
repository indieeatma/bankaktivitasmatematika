<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <style>html,body{background:#9CCBEA;margin:0}</style>
  <script>
    /* Jaring pengaman: bila ada galat JavaScript, tampilkan pesannya (bukan layar putih kosong) */
    window.addEventListener('error', function (e) {
      if (window.__errShown || !document.body) return; window.__errShown = true;
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#4A271A;color:#FFF4DC;padding:12px 14px;border:2px solid #D9A441;border-radius:12px;font:14px/1.4 system-ui,sans-serif';
      d.textContent = 'Terjadi kesalahan: ' + (e.message || 'tidak diketahui') + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')';
      document.body.appendChild(d);
    });
  </script>
  <title>Pernikahan Adat Jawa — SRAWUNG, Misi Menata Hajat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Huruf dimuat tanpa menahan tampilan halaman -->
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="header"></div>
  <div id="decor" aria-hidden="true"></div>
  <div id="view"><p style="font:18px system-ui,sans-serif;color:#4A271A;text-align:center;padding:40vh 20px 0">Memuat Pernikahan Adat Jawa…</p></div>
  <noscript><p style="font:18px system-ui,sans-serif;text-align:center;padding:20px">Game ini membutuhkan JavaScript. Aktifkan JavaScript di browser kamu.</p></noscript>
  <div id="modal-root" aria-live="polite"></div>
  <div id="toast-root" aria-live="polite"></div>

  <!-- Urutan penting: data → math → validation → gameState → audio → charts → ui → views → app -->
  <script src="js/data.js"></script>
  <script src="js/math.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/gameState.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
